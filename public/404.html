<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sayfa Bulunamadı | Teknoify</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: grid; place-items: center; padding: 24px;
            background: #050505; color: #f3f4f6;
            font-family: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.5;
        }
        main { max-width: 560px; text-align: center; }
        .code { font-family: 'Fira Code', Consolas, monospace; color: #6366f1; font-size: 0.95rem; letter-spacing: 0.08em; margin-bottom: 12px; }
        h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); letter-spacing: -0.02em; margin-bottom: 12px; }
        p { color: #9ca3af; margin-bottom: 28px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 12px;
            text-decoration: none; font-weight: 600; color: #fff; background: #6366f1;
        }
        a.secondary { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #f3f4f6; }
        a:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="code">HTTP 404</div>
        <h1>Aradığınız sayfa bulunamadı</h1>
        <p>Bağlantı değişmiş veya sayfa kaldırılmış olabilir. Ana sayfadan devam edebilir ya da bizimle iletişime geçebilirsiniz.</p>
        <div class="actions">
            <a href="/">Ana sayfaya dön</a>
            <a class="secondary" href="/#contact">İletişim</a>
        </div>
    </main>
</body>
</html>
